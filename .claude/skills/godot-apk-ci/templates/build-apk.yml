# Variant A (as requested): barichello/godot-ci container + firebelley/godot-export.
# Copy to .github/workflows/build-apk.yml only after the prerequisites in SKILL.md.
# NOT YET RUN on GitHub: the first run (workflow_dispatch) is the real check.
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  EXPORT_PRESET: "Android"
  APK_NAME: "kriticheskiy-proval"

jobs:
  build-apk:
    name: Export debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      # GitHub sets HOME=/github/home inside container jobs; the image keeps its
      # editor settings (Android SDK and JDK paths) under /root.
      - name: Copy the image's editor settings to the job HOME
        run: |
          mkdir -p "$HOME/.config"
          cp -r /root/.config/godot "$HOME/.config/godot"

      # A fresh debug keystore per run. Godot 4.7.2 reads these variables
      # (names checked in the 4.7.2 binary); no password is stored in the repo.
      - name: Generate a debug keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      # firebelley downloads Godot and the 1.19 GB export templates itself;
      # `cache: true` keeps them in the Actions cache between runs.
      - name: Export with godot-export
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: ./
          presets_to_export: ${{ env.EXPORT_PRESET }}
          export_debug: true
          cache: true

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-debug
          path: ${{ steps.export.outputs.build_directory }}/**/*.apk
          if-no-files-found: error

      - name: Attach APK to the Release (tags v* only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.export.outputs.build_directory }}/**/*.apk
