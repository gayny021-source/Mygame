name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверка сюжетов (граф сцен и 20 000 случайных прохождений)
        run: node tools/validate-story.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk smert-v-otpuske.apk

      - uses: actions/upload-artifact@v4
        with:
          name: smert-v-otpuske-apk
          path: smert-v-otpuske.apk

      - name: Релиз по тегу v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: smert-v-otpuske.apk
