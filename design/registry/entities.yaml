# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: stat_bonus
    status: active
    source: design/gdd/heroes.md
    referenced_by:
      - design/gdd/heroes.md
      - design/gdd/d20-checks.md
    variables:
      - hero_id
      - stat_id
    output_range: [-1, 5]
    expression: "heroes_data[hero_id].stats[stat_id].bonus"
    notes: "Read by d20-checks.md (formulas 1, 2, 5). Constant over a run; a debuff closes a stat but never changes the number."
    added: 2026-11-07
    revised: 2026-11-10
  - name: check_chance
    status: active
    source: design/gdd/d20-checks.md
    referenced_by:
      - design/gdd/d20-checks.md
      - design/gdd/heroes.md
    variables:
      - dc
      - bonus
    output_range: [5, 95]
    expression: "N = clamp(DC - bonus, 2, 20); chance = (21 - N) * 5"
    notes: "d20-checks.md formula 2. Percent, multiple of 5. N is the lowest natural face that succeeds (nat 1 always fails, nat 20 always succeeds). With dc 11/13/15 and bonus -1..+5, N = 6..16 and chance = 25..75, so the clamp never fires. heroes.md quotes it as clamp((21 - (DC - bonus)) * 5, 5, 95), proven equal for every integer DC - bonus. One roll without a token."
    added: 2026-11-10
    revised: ""

